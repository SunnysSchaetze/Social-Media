<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Media</title>
<style>
body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #000;
    font-family: Arial, sans-serif;
}

.social-media {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: clamp(1.2rem, 2vw, 2rem);
    color: orange;
    text-align: center;
    padding: 20px;
}

.social-media span {
    font-weight: bold;
}

.social-media a {
    display: flex;
    align-items: center;
    text-decoration: none;
    color: orange;
    gap: 10px;
    transition: transform 0.3s ease, filter 0.3s ease;
}

.social-media a:hover img {
    transform: scale(1.2);
    filter: brightness(1.5) drop-shadow(0 0 5px orange);
}

.social-media img {
    width: clamp(2rem, 4vw, 2.5rem);
    height: clamp(2rem, 4vw, 2.5rem);
}

@media (max-width: 600px) {
    .social-media {
        gap: 15px;
        font-size: 1rem;
    }
}
</style>
</head>
<body>
<div class="social-media">
    <span>Social Media:</span>
    <a href="https://www.facebook.com/profile.php?id=61583119800906" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968764.png" alt="Facebook">
    </a>
    <a href="https://www.instagram.com/sunnysschaetze/" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/3955/3955024.png" alt="Instagram">
    </a>
    <a href="https://www.tiktok.com/@sunnys.schaetze" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/3670/3670313.png" alt="TikTok">
    </a>
    <a href="https://tellonym.me/sunnys.schaetze" target="_blank">
        <img src="https://play-lh.googleusercontent.com/m-9v6JD0UawLVs_5tzjJ3Tgfv0kSSx-3uE9IBDcdz2rJ4FNvHSl8bx-GFQp1U9luBQ=w240-h480" alt="Tellonym">
    </a>
</div>
</body>
</html>
